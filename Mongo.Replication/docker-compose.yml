version: "3.9"

services:
  mongo1:
    image: mongo:7.0
    container_name: mongo1
    command: ["mongod", "--replSet=rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mongo1_data:/data/db
    networks: [mongo-net]

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    command: ["mongod", "--replSet=rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mongo2_data:/data/db
    networks: [mongo-net]

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    command: ["mongod", "--replSet=rs0", "--bind_ip_all"]
    ports:
      - "27019:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - mongo3_data:/data/db
    networks: [mongo-net]

  mongo-setup:
    image: mongo:7.0
    container_name: mongo-setup
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    entrypoint: [ "bash", "/init/init-replica.sh" ]
    volumes:
      - ./init:/init
    networks: [mongo-net]
    # запустится один раз, после инициализации завершится

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:

networks:
  mongo-net: