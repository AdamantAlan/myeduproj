version: '3.9'

services:
  # Координатор Citus
  postgres1:
    image: citusdata/citus:13.0-pg16
    container_name: postgres1
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: db1
    command: ["postgres", "-c", "shared_preload_libraries=citus"]
    ports:
      - "5433:5432"
    volumes:
      - postgres1_data:/var/lib/postgresql/data
    networks:
      - pg_net
    depends_on:
      - postgres2
      - postgres3

  # Воркер 1
  postgres2:
    image: citusdata/citus:13.0-pg16
    container_name: postgres2
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: db1
    command: ["postgres", "-c", "shared_preload_libraries=citus"]
    ports:
      - "5434:5432"
    volumes:
      - postgres2_data:/var/lib/postgresql/data
    networks:
      - pg_net

  # Воркер 2
  postgres3:
    image: citusdata/citus:13.0-pg16
    container_name: postgres3
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: db1
    command: ["postgres", "-c", "shared_preload_libraries=citus"]
    ports:
      - "5435:5432"
    volumes:
      - postgres3_data:/var/lib/postgresql/data
    networks:
      - pg_net

volumes:
  postgres1_data:
  postgres2_data:
  postgres3_data:

networks:
  pg_net:
    driver: bridge