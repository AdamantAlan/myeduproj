version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: zabbix-postgres
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    volumes:
      - ./zbx_data/db:/var/lib/postgresql/data
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-latest
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      ZBX_STARTAGENTS: 5
      ZBX_ENABLE_REMOTE_COMMANDS: 1
      ZBX_UNSAFEUSERPARAMETERS: 1
      ZBX_DEBUGLEVEL: 3
    depends_on:
      - postgres
    ports:
      - "10051:10051"
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-latest
    container_name: zabbix-web
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: "Europe/Moscow"
    depends_on:
      - zabbix-server
      - postgres
    ports:
      - "8080:8080"
    restart: unless-stopped

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-latest
    container_name: zabbix-agent
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER: zabbix-server
      ZBX_SERVER_ACTIVE: zabbix-server:10051
      ZBX_HOSTNAME: docker-agent
      ZBX_ACTIVE_ALLOW: true
      ZBX_PASSIVESERVERS: zabbix-server
    depends_on:
      - zabbix-server
    restart: unless-stopped

networks:
  default:
    name: zabbix-net