services:
  redis-master:
    image: redis:7-alpine
    container_name: redis-master
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --tcp-keepalive 300
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - redis_master_data:/data
    networks:
      - redis-net
      
  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    depends_on:
      redis-master:
        condition: service_healthy
    command: >
      redis-server
      --appendonly yes
      --replicaof redis-master 6379
      --replica-read-only yes
      --tcp-keepalive 300
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - redis_replica1_data:/data
    networks:
      - redis-net
      
  redis-replica-2:
    image: redis:7-alpine
    container_name: redis-replica-2
    depends_on:
      redis-master:
        condition: service_healthy
    command: >
      redis-server
      --appendonly yes
      --replicaof redis-master 6379
      --replica-read-only yes
      --tcp-keepalive 300
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 2s
      retries: 20
    volumes:
      - redis_replica2_data:/data
    networks:
      - redis-net
      
volumes:
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data:

networks:
  redis-net:
    driver: bridge