version: '3.9'

services:
  postgres1:
    image: postgres:16
    container_name: postgres1
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: db1
    ports:
      - "5433:5432"
    volumes:
      - postgres1_data:/var/lib/postgresql/data
    networks:
      - pg_net

  postgres2:
    image: postgres:16
    container_name: postgres2
    environment:
      POSTGRES_USER: user2
      POSTGRES_PASSWORD: pass2
      POSTGRES_DB: db2
    ports:
      - "5434:5432"
    volumes:
      - postgres2_data:/var/lib/postgresql/data
    networks:
      - pg_net

  postgres3:
    image: postgres:16
    container_name: postgres3
    environment:
      POSTGRES_USER: user3
      POSTGRES_PASSWORD: pass3
      POSTGRES_DB: db3
    ports:
      - "5435:5432"
    volumes:
      - postgres3_data:/var/lib/postgresql/data
    networks:
      - pg_net

volumes:
  postgres1_data:
  postgres2_data:
  postgres3_data:

networks:
  pg_net:
    driver: bridge