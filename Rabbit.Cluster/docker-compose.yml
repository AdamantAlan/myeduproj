services:
  rabbit1:
    image: rabbitmq:3.13-management
    hostname: rabbit1
    container_name: rabbit1
    environment:
      - RABBITMQ_ERLANG_COOKIE=supersecretcookie
      - RABBITMQ_USE_LONGNAME=true
    ports:
      - "15672:15672"   # web UI
      - "5672:5672"     # AMQP
    volumes:
      - rabbit1-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf

  rabbit2:
    image: rabbitmq:3.13-management
    hostname: rabbit2
    container_name: rabbit2
    environment:
      - RABBITMQ_ERLANG_COOKIE=supersecretcookie
      - RABBITMQ_USE_LONGNAME=true
    ports:
      - "15673:15672"
      - "5673:5672"
    volumes:
      - rabbit2-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    depends_on:
      - rabbit1

  rabbit3:
    image: rabbitmq:3.13-management
    hostname: rabbit3
    container_name: rabbit3
    environment:
      - RABBITMQ_ERLANG_COOKIE=supersecretcookie
      - RABBITMQ_USE_LONGNAME=true
    ports:
      - "15674:15672"
      - "5674:5672"
    volumes:
      - rabbit3-data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    depends_on:
      - rabbit1

volumes:
  rabbit1-data:
  rabbit2-data:
  rabbit3-data: