services:
  # -------- Config Server RS (3 ноды) --------
  cfg1:
    image: mongo:7.0
    container_name: cfg1
    command: ["mongod", "--configsvr", "--replSet=rs-config", "--bind_ip_all", "--port=27017"]
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.adminCommand({ ping: 1 })' | mongosh --quiet cfg1:27017 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 20s
    volumes: [cfg1_data:/data/db]
    networks: [mongo-net]

  cfg2:
    image: mongo:7.0
    container_name: cfg2
    command: ["mongod", "--configsvr", "--replSet=rs-config", "--bind_ip_all", "--port=27017"]
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.adminCommand({ ping: 1 })' | mongosh --quiet cfg2:27017 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 20s
    volumes: [cfg2_data:/data/db]
    networks: [mongo-net]

  cfg3:
    image: mongo:7.0
    container_name: cfg3
    command: ["mongod", "--configsvr", "--replSet=rs-config", "--bind_ip_all", "--port=27017"]
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.adminCommand({ ping: 1 })' | mongosh --quiet cfg3:27017 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 20s
    volumes: [cfg3_data:/data/db]
    networks: [mongo-net]

  # -------- Shards (по одному члену в каждом RS для демо) --------
  shard1a:
    image: mongo:7.0
    container_name: shard1a
    command: ["mongod", "--shardsvr", "--replSet=rs-shard-01", "--bind_ip_all", "--port=27017"]
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.adminCommand({ ping: 1 })' | mongosh --quiet shard1a:27017 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 120
    volumes: [shard1a_data:/data/db]
    networks: [mongo-net]

  shard2a:
    image: mongo:7.0
    container_name: shard2a
    command: ["mongod", "--shardsvr", "--replSet=rs-shard-02", "--bind_ip_all", "--port=27017"]
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.adminCommand({ ping: 1 })' | mongosh --quiet shard2a:27017 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 120
    volumes: [shard2a_data:/data/db]
    networks: [mongo-net]

  # -------- mongos (router) — публикуем наружу только его --------
  mongos:
    image: mongo:7.0
    container_name: mongos
    depends_on:
      cfg1: { condition: service_healthy }
      cfg2: { condition: service_healthy }
      cfg3: { condition: service_healthy }
    command: ["mongos", "--bind_ip_all", "--configdb=rs-config/cfg1:27017,cfg2:27017,cfg3:27017"]
    ports: ["27020:27017"]   # подключайся приложением к localhost:27020
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.adminCommand({ ping: 1 })' | mongosh --quiet localhost:27017 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 10s
    networks: [mongo-net]

  # -------- init-шаг: инициирует RS и добавляет шарды --------
  mongo-shard-setup:
    image: mongo:7.0
    container_name: mongo-shard-setup
    depends_on:
      cfg1: { condition: service_healthy }
      cfg2: { condition: service_healthy }
      cfg3: { condition: service_healthy }
      shard1a: { condition: service_healthy }
      shard2a: { condition: service_healthy }
      mongos:  { condition: service_healthy }
    entrypoint: ["bash", "/init/init-sharded.sh"]
    volumes: ["./init:/init:ro"]
    networks: [mongo-net]

volumes:
  cfg1_data:
  cfg2_data:
  cfg3_data:
  shard1a_data:
  shard2a_data:

networks:
  mongo-net:
