  redis-node-6:
    image: redis:7-alpine
    container_name: redis-node-6
    command: >
      redis-server
      --port 7006
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname redis-node-6
      --cluster-announce-ip host.docker.internal
      --cluster-announce-port 7006
      --cluster-announce-bus-port 17006
    ports:
      - "7006:7006"
      - "17006:17006"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7006", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - node6_data:/data
    networks: [redis-net]

  # одноразовый контейнер, который соберёт кластер (3 мастера, 3 реплики)
  cluster-create:
    image: redis:7-alpine
    container_name: redis-cluster-create
    depends_on:
      redis-node-1: { condition: service_healthy }
      redis-node-2: { condition: service_healthy }
      redis-node-3: { condition: service_healthy }
      redis-node-4: { condition: service_healthy }
      redis-node-5: { condition: service_healthy }
      redis-node-6: { condition: service_healthy }
    networks: [redis-net]
    entrypoint: >
      sh -eu -c '
        echo yes | redis-cli --cluster create \
          redis-node-1:7001 redis-node-2:7002 redis-node-3:7003 \
          redis-node-4:7004 redis-node-5:7005 redis-node-6:7006 \
          --cluster-replicas 1
        echo "Cluster created"
      '

volumes:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data:
  node6_data:

networks:
  redis-net:
    driver: bridge