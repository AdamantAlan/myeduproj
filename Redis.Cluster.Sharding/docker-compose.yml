services:
  redis-node-1:
    image: redis:7-alpine
    container_name: redis-node-1
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --cluster-announce-hostname redis-node-1
      --cluster-announce-ip host.docker.internal
      --cluster-announce-port 7001
      --cluster-announce-bus-port 17001
    ports:
      - "7001:7001"     # redis
      - "17001:17001"   # cluster bus
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - node1_data:/data
    networks: [redis-net]

  redis-node-2:
    image: redis:7-alpine
    container_name: redis-node-2
    command: >
      redis-server
