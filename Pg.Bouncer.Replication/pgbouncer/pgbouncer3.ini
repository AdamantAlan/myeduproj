[databases]
db1 = host=postgres3 port=5432 dbname=db1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

# РЕЖИМ ПУЛА: для EF Core/Npgsql самый безопасный — session
pool_mode = session

# Лимиты
max_client_conn = 2048
default_pool_size = 100
reserve_pool_size = 20
reserve_pool_timeout = 5

# Аутентификация (для локальной разработки можно trust; см. примечание ниже)
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt

# Поведение сессии
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits

# Логи (см. в docker logs)
admin_users = user1
stats_users = user1