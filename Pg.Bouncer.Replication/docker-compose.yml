version: '3.9'

services:
  postgres1:
    image: postgres:16
    container_name: postgres1
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: db1
    ports:
      - "5433:5432"
    volumes:
      - postgres1_data:/var/lib/postgresql/data
    networks:
      - pg_net

  postgres2:
    image: postgres:16
    container_name: postgres2
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: db1
    ports:
      - "5434:5432"
    volumes:
      - postgres2_data:/var/lib/postgresql/data
    networks:
      - pg_net

  postgres3:
    image: postgres:16
    container_name: postgres3
    environment:
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: pass1
      POSTGRES_DB: db1
    ports:
      - "5435:5432"
    volumes:
      - postgres3_data:/var/lib/postgresql/data
    networks:
      - pg_net

  pgbouncer1:
    image: edoburu/pgbouncer:v1.24.0-p1
    container_name: pgbouncer1
    restart: unless-stopped
    volumes:
      - ./pgbouncer/pgbouncer1.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks: 
      - pg_net

  pgbouncer2:
    image: edoburu/pgbouncer:v1.24.0-p1
    container_name: pgbouncer2
    restart: unless-stopped
    volumes:
      - ./pgbouncer/pgbouncer2.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks: 
      - pg_net

  pgbouncer3:
    image: edoburu/pgbouncer:v1.24.0-p1
    container_name: pgbouncer3
    restart: unless-stopped
    volumes:
      - ./pgbouncer/pgbouncer3.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks: 
      - pg_net

  haproxy:
    image: haproxy:2.9-alpine
    container_name: haproxy-pg
    restart: unless-stopped
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - postgres1
      - postgres2
      - postgres3
    networks:
      - pg_net
    ports:
      - "6432:6432"
      - "6433:6433"

volumes:
  postgres1_data:
  postgres2_data:
  postgres3_data:

networks:
  pg_net:
    driver: bridge